name: Update SBOM report

on:
  schedule:
    - cron: '17 5 * * MON' # Varje måndag kl. 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sbom-report
  cancel-in-progress: false

jobs:
  update-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore solution
        run: dotnet restore Privatekonomi.slnx

      - name: Test scanner
        run: dotnet test tests/Privatekonomi.Core.Tests/Privatekonomi.Core.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~SbomVersioningTests|FullyQualifiedName~SbomDataProviderTests"

      - name: Generate SBOM report
        run: dotnet run --project tests/SbomScanner/SbomScanner.csproj --configuration Release --no-restore -- --require-online

      - name: Commit updated report
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- docs/sbom-report.md tests/SbomScanner/vulnerabilities-cache.json
          if git diff --cached --quiet; then
            echo 'SBOM report is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update SBOM report' -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"